[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "picodesk"
version = "0.1.0"
description = "Python-MATLAB Virtual Functional Bus & calibration toolchain for RP2040"
readme = "README.md"
# GPL-3.0-or-later follows from using PyQt6 under its GPL option (a project
# decision; the commercial licence was declined). The firmware this toolchain
# produces links no Qt and is not covered — see docs/THIRD_PARTY_LICENSES.md.
license = "GPL-3.0-or-later"
license-files = ["../LICENSE"]
# Python must align exactly with the MATLAB Engine release (SRS section 8,
# v7.1: R2025b supports 3.9-3.12).
requires-python = ">=3.9,<3.13"
dependencies = [
    "PyQt6>=6.5",
    "pyxcp>=0.21",
    "pyelftools>=0.31",
    "asammdf>=7.4",
    "jinja2>=3.1",
    "jsonschema>=4.17",
]
# matlabengine is deliberately not declared: its version is locked to the locally
# installed MATLAB release (R2025b) and must be installed to match.

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-qt>=4.4",
    "ruff>=0.4",
]

[project.scripts]
picodesk = "picodesk.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["picodesk*"]

[tool.ruff]
target-version = "py39"
line-length = 100
