name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # SRS section 8 pin: ARM GCC 12.2.rel1 exactly.
  ARM_GCC_URL: https://developer.arm.com/-/media/Files/downloads/gnu/12.2.rel1/binrel/arm-gnu-toolchain-12.2.rel1-x86_64-arm-none-eabi.tar.xz
  ARM_GCC_DIR: arm-gnu-toolchain-12.2.rel1-x86_64-arm-none-eabi

jobs:
  # ---- Phase 0: host toolchain quality ------------------------------------
  host-lint:
    name: host / lint (P0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check host tests tools

  host-tests:
    name: host / pytest + GUI (P0-P7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Headless Qt dependencies (GUI tests, P7)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq
             libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: pip install -e "host[dev]"
      # QT_QPA_PLATFORM=offscreen lets the widget tests run without a display.
      - run: QT_QPA_PLATFORM=offscreen pytest tests -q
      - name: Dependency checker report (informational)
        run: python -m picodesk.buildsys.dependency_checker --json
      - name: Requirement traceability report (P8)
        run: |
          pip install pyyaml
          QT_QPA_PLATFORM=offscreen python tools/traceability.py \
            --markdown build-traceability.md
      - name: Upload traceability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traceability-report
          path: build-traceability.md
          if-no-files-found: ignore
      - name: Render GUI screenshots (P7 visual review)
        run: QT_QPA_PLATFORM=offscreen python tools/gui_screenshot.py build-gui-shots
      - name: Upload GUI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-screenshots
          path: build-gui-shots/*.png
          if-no-files-found: ignore

  # ---- Phase 8: cross-platform validation (SRS 1.3 = Windows/Linux x64) ---
  host-windows:
    name: host / Windows (P8)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e "host[dev]"
      # Qt needs no extra system packages on the Windows runner; offscreen
      # keeps the widget tests headless there too.
      - name: Host + GUI tests on Windows
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests -q --ignore=tests/native
      - name: Dependency checker on Windows (GUI-004 path handling)
        run: python -m picodesk.buildsys.dependency_checker --json
      - name: RTE generation on Windows (path separators, line endings)
        run: |
          $env:PYTHONPATH="host"
          python -m picodesk.rtegen.generator `
            --descriptor tests/fixtures/gen_ws/descriptor.json `
            --routing tests/fixtures/gen_ws/routing.json `
            --hal-manifest target/hal/hal_manifest.json `
            --out build-gen-src
      - name: Sizing gate on Windows (BLD-004)
        run: |
          python tools/sizing_report.py `
            --descriptor tests/fixtures/gen_ws/descriptor.json `
            --routing tests/fixtures/gen_ws/routing.json

  # ---- Phases 2-3: RTE primitives + XCP protocol cores, native tests -------
  # Covers both slaves: the interim core and vendored XCPlite behind its port.
  native-rte:
    name: native / RTE + XCP protocol tests (P2-P3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S tests/native -B build-native -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-native
      - run: ctest --test-dir build-native --output-on-failure

  # ---- Phases 1-5: whole-firmware system tests on emulated RP2040 ----------
  renode-sim:
    name: sim / Renode system tests (P1-P8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Cache ARM GCC 12.2.rel1
        id: cache-toolchain-sim
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/arm-gcc
          key: ${{ env.ARM_GCC_DIR }}
      - name: Fetch ARM GCC 12.2.rel1
        if: steps.cache-toolchain-sim.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ runner.temp }}/arm-gcc"
          curl -sL "$ARM_GCC_URL" | tar xJ -C "${{ runner.temp }}/arm-gcc"
      - name: Toolchain on PATH
        run: echo "${{ runner.temp }}/arm-gcc/${ARM_GCC_DIR}/bin" >> "$GITHUB_PATH"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
      - name: Build simulation firmware (PICODESK_SIM)
        run: |
          cmake -S target -B build-sim -G Ninja -DCMAKE_BUILD_TYPE=Release -DPICODESK_SIM=ON
          ninja -C build-sim
      - name: Cache Renode 1.16.1
        id: cache-renode
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/renode
          key: renode-1.16.1-portable
      - name: Fetch Renode 1.16.1
        if: steps.cache-renode.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ runner.temp }}/renode"
          curl -sL https://github.com/renode/renode/releases/download/v1.16.1/renode-1.16.1.linux-portable.tar.gz \
            | tar xz -C "${{ runner.temp }}/renode"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Renode test framework + generator deps
        run: |
          pip install -r "${{ runner.temp }}/renode/renode_1.16.1_portable/tests/requirements.txt"
          pip install jinja2 jsonschema
      - name: Run system tests (boot, dispatch, seqlocks, DAQ, CAL switch)
        run: |
          "${{ runner.temp }}/renode/renode_1.16.1_portable/renode-test" \
            --variable "FIRMWARE:$GITHUB_WORKSPACE/build-sim/picodesk_firmware.elf" \
            sim/picodesk.robot
      - name: Build simulation firmware with vendored XCPlite (CAL-001)
        run: |
          cmake -S target -B build-sim-xcplite -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPICODESK_SIM=ON -DPICODESK_XCPLITE=ON
          ninja -C build-sim-xcplite
          python3 tools/check_memmap.py build-sim-xcplite/picodesk_firmware.elf.map
      - name: Run system tests against the XCPlite build (CAL-001)
        # Same suite, protocol engine substituted. The CAL-page case is the one
        # that matters: it proves the library did not take the step-boundary
        # switch away from the RTE (RTE-003).
        run: |
          "${{ runner.temp }}/renode/renode_1.16.1_portable/renode-test" \
            --variable "FIRMWARE:$GITHUB_WORKSPACE/build-sim-xcplite/picodesk_firmware.elf" \
            sim/picodesk.robot
      - name: Generate RTE from the fixture workspace (P5)
        run: |
          PYTHONPATH=host python -m picodesk.rtegen.generator \
            --descriptor tests/fixtures/gen_ws/descriptor.json \
            --routing tests/fixtures/gen_ws/routing.json \
            --hal-manifest target/hal/hal_manifest.json \
            --out build-gen-src
          mkdir -p build-gen-src/models
          cp tests/fixtures/gen_ws/models/*.c build-gen-src/models/
      - name: Build generated firmware (P5, milestone M1)
        run: |
          cmake -S target -B build-gen -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPICODESK_SIM=ON -DPICODESK_GEN_DIR="$GITHUB_WORKSPACE/build-gen-src"
          ninja -C build-gen picodesk_gen_firmware
      - name: Run generated-RTE system test (P5, milestone M1)
        run: |
          "${{ runner.temp }}/renode/renode_1.16.1_portable/renode-test" \
            --variable "FIRMWARE:$GITHUB_WORKSPACE/build-gen/picodesk_gen_firmware.elf" \
            sim/picodesk_gen.robot
      - name: Run fault-injection drills (P6, BLD-006/BLD-007)
        run: |
          "${{ runner.temp }}/renode/renode_1.16.1_portable/renode-test" \
            --variable "FIRMWARE:$GITHUB_WORKSPACE/build-sim/picodesk_firmware.elf" \
            sim/picodesk_faults.robot
      - name: Build 28-model scale workspace (P8, SRS 1.1)
        run: |
          python tools/make_scale_workspace.py build-scale-ws --models 28
          cmake -S target -B build-scale -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPICODESK_SIM=ON -DPICODESK_GEN_DIR="$GITHUB_WORKSPACE/build-scale-ws/gen"
          ninja -C build-scale picodesk_gen_firmware
          python3 tools/check_memmap.py build-scale/picodesk_gen_firmware.elf.map
      - name: Run scale system test (P8)
        run: |
          "${{ runner.temp }}/renode/renode_1.16.1_portable/renode-test" \
            --variable "FIRMWARE:$GITHUB_WORKSPACE/build-scale/picodesk_gen_firmware.elf" \
            sim/picodesk_scale.robot
      - name: Sizing report gate + map calibration (P6, BLD-004)
        run: |
          pip install pyelftools
          python tools/sizing_report.py \
            --descriptor tests/fixtures/gen_ws/descriptor.json \
            --routing tests/fixtures/gen_ws/routing.json \
            --map build-gen/picodesk_gen_firmware.elf.map
      - name: A2L generation + DWARF patching (P6, CAL-002)
        run: |
          python tools/make_a2l.py \
            --descriptor tests/fixtures/gen_ws/descriptor.json \
            --elf build-gen/picodesk_gen_firmware.elf \
            --out build-gen/picodesk.a2l
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-workspace
          path: |
            build-gen-src/*.c
            build-gen-src/*.h
            build-gen/picodesk.a2l
            build-gen/picodesk_gen_firmware.elf.map
          if-no-files-found: ignore
      - name: Upload Robot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renode-robot-logs
          path: |
            log.html
            report.html
            robot_output.xml
          if-no-files-found: ignore

  # ---- Phase 0/1: firmware build + BLD-008 reproducibility gate -----------
  firmware:
    name: firmware / build + reproducibility (P0-P1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Init pico-sdk tinyusb (nested submodule, shallow)
        run: git -C external/pico-sdk submodule update --init --depth 1 lib/tinyusb
      - name: Cache ARM GCC 12.2.rel1
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/arm-gcc
          key: ${{ env.ARM_GCC_DIR }}
      - name: Fetch ARM GCC 12.2.rel1
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ runner.temp }}/arm-gcc"
          curl -sL "$ARM_GCC_URL" | tar xJ -C "${{ runner.temp }}/arm-gcc"
      - name: Toolchain on PATH
        run: |
          echo "${{ runner.temp }}/arm-gcc/${ARM_GCC_DIR}/bin" >> "$GITHUB_PATH"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
      - name: Verify pinned compiler
        run: arm-none-eabi-gcc --version | head -1 | grep -F "12.2"
      - name: Build A
        run: |
          cmake -S target -B build-a -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -C build-a
      - name: Memory bank audit (BLD-001/BLD-002, P1)
        run: python3 tools/check_memmap.py build-a/picodesk_firmware.elf.map
      - name: Build B (independent tree)
        run: |
          cmake -S target -B build-b -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -C build-b
      - name: Reproducibility gate (BLD-008)
        run: |
          sha256sum build-a/picodesk_firmware.uf2 build-b/picodesk_firmware.uf2
          cmp build-a/picodesk_firmware.uf2 build-b/picodesk_firmware.uf2
      - name: Build with vendored XCPlite (CAL-001) + audit + reproducibility
        # Third-party sources are where a __DATE__ or an absolute path is most
        # likely to slip in, so the XCPlite variant is held to the same gate.
        run: |
          cmake -S target -B build-xcp-a -G Ninja -DCMAKE_BUILD_TYPE=Release -DPICODESK_XCPLITE=ON
          ninja -C build-xcp-a
          python3 tools/check_memmap.py build-xcp-a/picodesk_firmware.elf.map
          cmake -S target -B build-xcp-b -G Ninja -DCMAKE_BUILD_TYPE=Release -DPICODESK_XCPLITE=ON
          ninja -C build-xcp-b
          sha256sum build-xcp-a/picodesk_firmware.uf2 build-xcp-b/picodesk_firmware.uf2
          cmp build-xcp-a/picodesk_firmware.uf2 build-xcp-b/picodesk_firmware.uf2
      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: picodesk_firmware
          path: |
            build-a/picodesk_firmware.uf2
            build-a/picodesk_firmware.elf.map
