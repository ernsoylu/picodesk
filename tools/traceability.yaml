# Requirement -> evidence matrix (SRS v7.0, Phase 8).
#
# Each requirement lists the concrete artefacts that verify it. The runner
# (tools/traceability.py) checks that every named artefact EXISTS — pytest
# node ids are collected, Robot test names are located in their suites, files
# are stat'd — so a stale entry fails the report instead of quietly claiming
# coverage that evaporated.
#
# kinds:
#   pytest   node id, collected from the host suite
#   robot    "<suite>.robot::<Test Name>" run under Renode
#   native   ctest test name (portable C, pthread stress)
#   ci       a named step in .github/workflows/ci.yml
#   file     an artefact whose existence is the evidence
#   hardware a gate that CANNOT be closed without a physical Pico
#
# `status: hardware` means the requirement is implemented and verified as far
# as emulation and host testing allow, with the remaining gate on hardware.

